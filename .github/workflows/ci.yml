name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project and quality tools
        run: python -m pip install ".[dev]"
      - name: Verify formatting
        run: python -m black --check src tests
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        run: python -m pytest

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag drug-trafficking-osint:${{ github.sha }} .
