[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "drug-trafficking-osint"
version = "0.1.0"
description = "Clean-architecture foundation for an OSINT drug-trafficking detection platform."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [
  { name = "Project Team" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85",
    "fastapi>=0.115.0,<1.0.0",
    "pymongo>=4.8.0,<5.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "spacy>=3.8.0,<3.9.0",
    "telethon>=1.39.0,<2.0.0",
    "torch>=2.2.0,<3.0.0",
    "transformers>=4.45.0,<6.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "black>=25.1.0,<26.0.0",
  "mypy>=1.14.0,<2.0.0",
  "pre-commit>=4.2.0,<5.0.0",
  "pytest>=8.3.5,<9.0.0",
  "pytest-asyncio>=0.25.0,<2.0.0",
  "pytest-cov>=6.1.1,<7.0.0",
  "ruff>=0.11.0,<1.0.0",
]

[project.scripts]
osint-api = "drug_trafficking_osint.interfaces.api.main:run"
osint-foundation = "drug_trafficking_osint.main:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/drug_trafficking_osint"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["COM812"]

[tool.ruff.lint.isort]
known-first-party = ["drug_trafficking_osint"]

[tool.black]
line-length = 100
target-version = ["py313"]
extend-exclude = "(work|outputs)"

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config", "-m", "not integration", "--cov=drug_trafficking_osint", "--cov-report=term-missing"]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires live external services and credentials",
]

[tool.coverage.run]
branch = true
source = ["drug_trafficking_osint"]

[tool.coverage.report]
fail_under = 50
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
packages = ["drug_trafficking_osint"]
